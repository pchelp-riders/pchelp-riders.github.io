<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハチミツ争奪戦 集計</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
 background:#f3f6f4;color:#1f2420;line-height:1.6;padding:12px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin-bottom:2px}
.upd{font-size:12px;color:#7b8a80;margin-bottom:16px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
h2{font-size:15px;font-weight:700;color:#2f6b4f;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e3ece7}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid #eef2ef;text-align:right;white-space:nowrap}
th{font-size:12px;color:#7b8a80;font-weight:600;background:#fafcfb}
td.n,th.n{text-align:left;white-space:normal}
tr:last-child td{border-bottom:none}
.bonus td{background:#fffdf0;color:#8a6d1f}
.me{font-variant-numeric:tabular-nums}
.axis{display:flex;flex-wrap:wrap;gap:8px}
.ax{flex:1 1 150px;background:#f7faf8;border:1px solid #e3ece7;border-radius:10px;padding:10px 12px}
.ax .nm{font-size:12px;color:#7b8a80}
.ax .rk{font-size:20px;font-weight:700}
.ax .pz{font-size:12px;color:#2f6b4f;font-weight:600}
.tot{margin-top:10px;background:#fff6e0;border:1px solid #f0d9a0;border-radius:10px;
 padding:9px 12px;font-weight:700;color:#8a6d1f;text-align:center}
.map{font-size:13px}
.map dt{font-weight:700;margin-top:8px;color:#2f6b4f}
.map dd{color:#56635b;word-break:break-all;font-size:12px}
.note{font-size:12px;color:#7b8a80;margin-top:4px}
.foot{font-size:11px;color:#9aa8a0;text-align:center;margin:18px 0 8px}
.filters{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
#pf,#df,#q{width:100%;padding:10px 11px;font-size:15px;border:1px solid #d6e0da;
 border-radius:9px;background:#fafcfb;color:#1f2420;-webkit-appearance:none}
#pf,#df{background-image:linear-gradient(45deg,transparent 50%,#7b8a80 50%),
 linear-gradient(135deg,#7b8a80 50%,transparent 50%);
 background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#q:focus,#pf:focus,#df:focus{outline:none;border-color:#2f6b4f;background-color:#fff}
.hit{font-size:12px;color:#7b8a80;margin-bottom:4px}
.logwrap{max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch}
.logwrap table{font-size:13px}
.logwrap th{position:sticky;top:0;z-index:1}
.logwrap td.ax,.logwrap th.ax{white-space:nowrap}
.logwrap tbody tr:nth-child(even) td{background:#fbfdfc}
/* 垢とptの間の区切り線 */
.logwrap th:nth-child(3),.logwrap td:nth-child(3){border-right:1px solid #d6e0da}
.p40{color:#1f7a4d;font-weight:700}.p5{color:#9a7b1f;font-weight:700}.p1{color:#a3b0a8}
.asof{font-size:11px;opacity:.65;margin-top:2px}
.asofnote{font-size:11px;opacity:.7;margin-top:8px;line-height:1.5}
#more{display:block;width:100%;margin-top:10px;padding:11px;font-size:14px;
 border:1px solid #d6e0da;border-radius:9px;background:#fafcfb;color:#2f6b4f;
 font-weight:600;cursor:pointer}
.none{font-size:13px;color:#9aa8a0;text-align:center;padding:22px 0}

.gate{max-width:360px;margin:60px auto;background:#fff;border-radius:12px;
 box-shadow:0 2px 14px rgba(0,0,0,.1);padding:26px 22px;text-align:center}
.gate h1{font-size:18px;margin-bottom:6px}
.gate p{font-size:13px;color:#7b8a80;margin-bottom:16px}
.gate input{width:100%;padding:11px;font-size:16px;border:1px solid #d6e0da;
 border-radius:9px;background:#fafcfb;margin-bottom:10px}
.gate button{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;
 border-radius:9px;background:#2f6b4f;color:#fff;cursor:pointer}
.gate .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:1.2em}
details.admin{margin:14px 0;padding:12px;border:1px dashed #9bb;border-radius:10px;background:#fbfdfc}
details.admin summary{cursor:pointer;font-weight:700;font-size:14px}
.adlogin input,.adlogin button{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:9px;font-size:15px}
.adlogin button,.adreg{background:#2f6b4f;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.adreg{padding:8px 12px;white-space:nowrap}
.adreg:disabled{opacity:.5}
.adt{width:100%;margin-top:8px}.adt td{padding:6px 4px;vertical-align:middle}
.adt select,.adt input{width:100%;box-sizing:border-box;padding:7px;font-size:14px}
.adt input{margin-top:4px}.adt .sub{font-size:12px;color:#777}
.admsg{font-size:13px;margin:8px 0;color:#2f6b4f;min-height:1em}.admsg.bad{color:#c0392b}
</style></head><body>

function initLog(LOG){
  if(!LOG||!LOG.length)return;
  var STEP=200,shown=0,hits=LOG,
      b=document.getElementById('logb'),q=document.getElementById('q'),
      pf=document.getElementById('pf'),df=document.getElementById('df'),
      hit=document.getElementById('hit'),more=document.getElementById('more');
  function esc(s){return String(s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function draw(n){var h='',e=Math.min(shown+n,hits.length);
    for(var i=shown;i<e;i++){var r=hits[i],
        cls=r[3]>=40?'p40':(r[3]>=5?'p5':'p1'),
        day=String(r[0]).replace(/^\d{4}\//,'');
      h+='<tr><td class=ax>'+esc(day)+'</td><td class=ax>'+esc(r[1])+
         '</td><td class=n>'+esc(r[2])+'</td>'+
         '<td class="me '+cls+'">+'+esc(r[3])+'</td>'+
         '<td class=ax>'+esc(r[4])+'</td><td class=n>'+esc(r[5]||'未登録')+'</td></tr>';}
    b.insertAdjacentHTML('beforeend',h);shown=e;
    more.style.display=shown<hits.length?'block':'none';
    hit.textContent=hits.length+'件'+(shown<hits.length?'（'+shown+'件表示中）':'');}
  function run(){var v=q.value.trim().toLowerCase(),p=pf.value,d=df.value;
    hits=LOG.filter(function(r){
      if(p&&r[5]!==p)return false;
      if(d&&r[0]!==d)return false;
      return v?r.join(' ').toLowerCase().indexOf(v)>=0:true;});
    b.innerHTML='';shown=0;
    if(!hits.length){hit.textContent='0件';more.style.display='none';
      b.innerHTML='<tr><td colspan=6 class=none>見つかりません</td></tr>';return;}
    draw(STEP);}
  q.addEventListener('input',run);
  pf.addEventListener('change',run);
  df.addEventListener('change',run);

function b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},base,256);
  var key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  return JSON.parse(new TextDecoder().decode(plain));
}
