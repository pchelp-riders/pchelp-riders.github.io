<title>ハチミツ争奪戦 集計</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
 background:#f3f6f4;color:#1f2420;line-height:1.6;padding:12px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin-bottom:2px}
.upd{font-size:12px;color:#7b8a80;margin-bottom:16px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
h2{font-size:15px;font-weight:700;color:#2f6b4f;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e3ece7}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid #eef2ef;text-align:right;white-space:nowrap}
th{font-size:12px;color:#7b8a80;font-weight:600;background:#fafcfb}
td.n,th.n{text-align:left;white-space:normal}
tr:last-child td{border-bottom:none}
.bonus td{background:#fffdf0;color:#8a6d1f}
.me{font-variant-numeric:tabular-nums}
.axis{display:flex;flex-wrap:wrap;gap:8px}
.ax{flex:1 1 150px;background:#f7faf8;border:1px solid #e3ece7;border-radius:10px;padding:10px 12px}
.ax .nm{font-size:12px;color:#7b8a80}
.ax .rk{font-size:20px;font-weight:700}
.ax .pz{font-size:12px;color:#2f6b4f;font-weight:600}
.tot{margin-top:10px;background:#fff6e0;border:1px solid #f0d9a0;border-radius:10px;
 padding:9px 12px;font-weight:700;color:#8a6d1f;text-align:center}
.map{font-size:13px}
.map dt{font-weight:700;margin-top:8px;color:#2f6b4f}
.map dd{color:#56635b;word-break:break-all;font-size:12px}
.note{font-size:12px;color:#7b8a80;margin-top:4px}
.foot{font-size:11px;color:#9aa8a0;text-align:center;margin:18px 0 8px}
.filters{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
#pf,#af,#df,#q{width:100%;padding:10px 11px;font-size:15px;border:1px solid #d6e0da;
 border-radius:9px;background:#fafcfb;color:#1f2420;-webkit-appearance:none}
#pf,#af,#df{background-image:linear-gradient(45deg,transparent 50%,#7b8a80 50%),
 linear-gradient(135deg,#7b8a80 50%,transparent 50%);
 background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#q:focus,#pf:focus,#af:focus,#df:focus{outline:none;border-color:#2f6b4f;background-color:#fff}
.hit{font-size:12px;color:#7b8a80;margin-bottom:4px}
.logwrap{max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch}
.logwrap table{font-size:13px}
.logwrap th{position:sticky;top:0;z-index:1}
.logwrap td.ax,.logwrap th.ax{white-space:nowrap}
.logwrap tbody tr:nth-child(even) td{background:#fbfdfc}
/* 垢とptの間の区切り線 */
.logwrap th:nth-child(3),.logwrap td:nth-child(3){border-right:1px solid #d6e0da}
.p40{color:#1f7a4d;font-weight:700}.p5{color:#9a7b1f;font-weight:700}.p1{color:#a3b0a8}
.asof{font-size:11px;opacity:.65;margin-top:2px}
.asofnote{font-size:11px;opacity:.7;margin-top:8px;line-height:1.5}
#more{display:block;width:100%;margin-top:10px;padding:11px;font-size:14px;
 border:1px solid #d6e0da;border-radius:9px;background:#fafcfb;color:#2f6b4f;
 font-weight:600;cursor:pointer}
.none{font-size:13px;color:#9aa8a0;text-align:center;padding:22px 0}

.gate{max-width:360px;margin:60px auto;background:#fff;border-radius:12px;
 box-shadow:0 2px 14px rgba(0,0,0,.1);padding:26px 22px;text-align:center}
.gate h1{font-size:18px;margin-bottom:6px}
.gate p{font-size:13px;color:#7b8a80;margin-bottom:16px}
.gate input{width:100%;padding:11px;font-size:16px;border:1px solid #d6e0da;
 border-radius:9px;background:#fafcfb;margin-bottom:10px}
.gate button{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;
 border-radius:9px;background:#2f6b4f;color:#fff;cursor:pointer}
.gate .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:1.2em}
/* 📌 行方不明者（もとは「指名手配」。2026/10/22 庄司さんの指示で言い換えた。
   犯人ではなく、持ち主が分からない垢なので）。
   画像を足さずに紙の質感を出す（ページは1ファイルで配るため） */
.card.wanted{position:relative;border:none;padding:0;background:none;box-shadow:none;
  margin:4px 2px 18px;
  /* 🚨 影は box-shadow ではなく drop-shadow。clip-path で破った形に沿わせるため */
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.32))}
/* 画鋲は紙の外にはみ出すので、切られない親側に置く */
.card.wanted::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-9px;
  width:18px;height:18px;border-radius:50%;background:#b23b2e;z-index:3;
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4)}
/* 印刷のかすれ。紙とインクの上に薄い粉を散らす */
.wwear{position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:radial-gradient(rgba(243,233,210,.5) .7px,transparent .95px);
  background-size:3px 3px;mix-blend-mode:screen;opacity:.3}
.wpaper{position:relative;border:none;padding:26px 14px 22px;clip-path:polygon(0.0% 5px,3.8% 4px,7.7% 0px,11.5% 3px,15.4% 0px,19.2% 2px,23.1% 3px,26.9% 4px,30.8% 1px,34.6% 2px,38.5% 1px,42.3% 9px,46.2% 0px,50.0% 1px,53.8% 2px,57.7% 5px,61.5% 0px,65.4% 2px,69.2% 7px,73.1% 1px,76.9% 3px,80.8% 8px,84.6% 1px,88.5% 6px,92.3% 6px,96.2% 6px,100.0% 0px,100.0% calc(100% - 2px),96.2% calc(100% - 7px),92.3% calc(100% - 1px),88.5% calc(100% - 9px),84.6% calc(100% - 2px),80.8% calc(100% - 5px),76.9% calc(100% - 8px),73.1% calc(100% - 9px),69.2% calc(100% - 1px),65.4% calc(100% - 2px),61.5% calc(100% - 0px),57.7% calc(100% - 7px),53.8% calc(100% - 9px),50.0% calc(100% - 5px),46.2% calc(100% - 9px),42.3% calc(100% - 7px),38.5% calc(100% - 3px),34.6% calc(100% - 8px),30.8% calc(100% - 3px),26.9% calc(100% - 9px),23.1% calc(100% - 3px),19.2% calc(100% - 0px),15.4% calc(100% - 8px),11.5% calc(100% - 3px),7.7% calc(100% - 3px),3.8% calc(100% - 2px),0.0% calc(100% - 9px));
  color:#2b2118;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
  background:#efe3c8;
  /* 上から順に：コーヒーの輪染み／中央の折り目／シミ2つ／紙の繊維 */
  background-image:
    radial-gradient(circle at 87% 23%,transparent 0 15px,rgba(120,70,20,.15) 15px 18px,transparent 19px),
    linear-gradient(90deg,transparent calc(50% - 1px),rgba(120,85,40,.17) 50%,transparent calc(50% + 1px)),
    radial-gradient(ellipse at 18% 12%,rgba(120,85,40,.16),transparent 55%),
    radial-gradient(ellipse at 82% 78%,rgba(120,85,40,.14),transparent 55%),
    repeating-linear-gradient(97deg,rgba(150,115,60,.05) 0 2px,transparent 2px 5px);
  box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 0 44px rgba(120,80,30,.26);
  transform:rotate(-.45deg)}
/* 四隅のマスキングテープ */
.wtape{position:absolute;z-index:3;width:54px;height:17px;background:rgba(226,210,166,.72);
  border:1px solid rgba(150,128,84,.45);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.wtape.tl{top:-7px;left:-12px;transform:rotate(-34deg)}
.wtape.tr{top:-7px;right:-12px;transform:rotate(33deg)}
.wtape.bl{bottom:-7px;left:-12px;transform:rotate(33deg)}
.wtape.br{bottom:-7px;right:-12px;transform:rotate(-34deg)}
/* 赤いゴム印。かすれさせたいので薄く重ねる */
.wstamp{position:absolute;right:2px;top:62px;transform:rotate(-15deg);/* 見出しに被せない。ここが一番先に読まれる */
  border:3px double #b23b2e;border-radius:5px;color:#b23b2e;
  padding:3px 7px;font-size:12px;font-weight:700;letter-spacing:.14em;
  opacity:.58;pointer-events:none;line-height:1.3;text-align:center}
/* 印刷された枠。紙の縁は破れているので、枠は内側に1本だけ */
.wpaper::after{content:"";position:absolute;inset:15px 9px;border:2px solid #2b2118;
  pointer-events:none;opacity:.62}
.wttl{text-align:center;font-size:30px;font-weight:700;letter-spacing:.34em;
  text-indent:.34em;line-height:1.15;margin:2px 0 0}
.wsub{text-align:center;font-size:11px;letter-spacing:.42em;text-indent:.42em;
  opacity:.75;margin:2px 0 10px}
.wrule{border:0;border-top:2px solid #2b2118;margin:0 0 12px;opacity:.85}
.wgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:0}
.w{width:116px;text-align:center}
.wshot{position:relative;z-index:3;width:96px;height:96px;margin:0 auto;padding:4px;background:#f6eed8;
  border:2px solid #2b2118;box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* 面通しの番号札（写真の下にぶら下げる） */
.wnum{display:inline-block;background:#2b2118;color:#efe3c8;font-size:10px;
  letter-spacing:.16em;padding:1px 7px;margin-top:-3px;position:relative;z-index:1}
.wfoot{margin-top:13px;border-top:2px solid #2b2118;padding-top:9px;
  font-size:12px;line-height:1.7;text-align:center}
.wfoot b{background:linear-gradient(transparent 62%,rgba(178,59,46,.35) 62%)}
.w{width:92px;text-align:center}
.wic{width:100%;height:100%;object-fit:cover;display:block;
  filter:sepia(.62) contrast(1.06) saturate(.85)}
.wic.none{display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#9a8b6e;font-weight:700;background:#e2d6ba}
.wn{font-size:14px;font-weight:700;margin-top:7px;word-break:break-all;letter-spacing:.04em}
.wp{font-size:12px;margin-top:2px}
.wd{font-size:11px;opacity:.72}
details.admin{margin:14px 0;padding:12px;border:1px dashed #9bb;border-radius:10px;background:#fbfdfc}
details.admin summary{cursor:pointer;font-weight:700;font-size:14px}
.adic{width:34px;height:34px;border-radius:50%;vertical-align:middle;margin-right:7px;background:#eee}
.adlogin input,.adlogin button{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:9px;font-size:15px}
.adlogin button,.adreg{background:#2f6b4f;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.adreg{padding:8px 12px;white-space:nowrap}
.adreg:disabled{opacity:.5}
.adt{width:100%;margin-top:8px}.adt td{padding:6px 4px;vertical-align:middle}
.adt select,.adt input{width:100%;box-sizing:border-box;padding:7px;font-size:14px}
.adt input{margin-top:4px}.adt .sub{font-size:12px;color:#777}
.admsg{font-size:13px;margin:8px 0;color:#2f6b4f;min-height:1em}.admsg.bad{color:#c0392b}

function initLog(LOG){
  if(!LOG||!LOG.length)return;
  var STEP=200,shown=0,hits=LOG,
      b=document.getElementById('logb'),q=document.getElementById('q'),
      pf=document.getElementById('pf'),df=document.getElementById('df'),
      af=document.getElementById('af'),
      hit=document.getElementById('hit'),more=document.getElementById('more');
  function esc(s){return String(s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function draw(n){var h='',e=Math.min(shown+n,hits.length);
    for(var i=shown;i<e;i++){var r=hits[i],
        cls=r[3]>=40?'p40':(r[3]>=5?'p5':'p1'),
        day=String(r[0]).replace(/^\d{4}\//,'');
      h+='<tr><td class=ax>'+esc(day)+'</td><td class=ax>'+esc(r[1])+
         '</td><td class=n>'+esc(r[2])+'</td>'+
         '<td class="me '+cls+'">+'+esc(r[3])+'</td>'+
         '<td class=ax>'+esc(r[4])+'</td><td class=n>'+esc(r[5]||'未登録')+'</td></tr>';}
    b.insertAdjacentHTML('beforeend',h);shown=e;
    more.style.display=shown<hits.length?'block':'none';
    hit.textContent=hits.length+'件'+(shown<hits.length?'（'+shown+'件表示中）':'');}
  // 🆔 垢の一覧を作る。オプチャ名が選ばれていれば、その人の垢だけに絞る
  //    （2026/10/27 庄司さん「垢でも検索できるようにしてください」。
  //     68垢あるので全部並べると探せない）
  function fillAcc(){
    var p=pf.value,keep=af.value,seen={},list=[];
    LOG.forEach(function(r){
      if(p&&r[5]!==p)return;
      if(!r[2]||seen[r[2]])return;
      seen[r[2]]=1;list.push([r[2],r[5]||'未登録']);});
    list.sort(function(x,y){return x[0].localeCompare(y[0],'ja');});
    var h='<option value="">🆔 垢（すべて）</option>';
    list.forEach(function(x){
      h+='<option value="'+esc(x[0])+'">'+esc(x[0])+'（'+esc(x[1])+'）</option>';});
    af.innerHTML=h;
    af.value=seen[keep]?keep:'';}
  function run(){var v=q.value.trim().toLowerCase(),p=pf.value,d=df.value,a=af.value;
    hits=LOG.filter(function(r){
      if(p&&r[5]!==p)return false;
      if(a&&r[2]!==a)return false;
      if(d&&r[0]!==d)return false;
      return v?r.join(' ').toLowerCase().indexOf(v)>=0:true;});
    b.innerHTML='';shown=0;
    if(!hits.length){hit.textContent='0件';more.style.display='none';
      b.innerHTML='<tr><td colspan=6 class=none>見つかりません</td></tr>';return;}
    draw(STEP);}
  q.addEventListener('input',run);
  pf.addEventListener('change',function(){fillAcc();run();});
  af.addEventListener('change',run);
  df.addEventListener('change',run);
  // 🚨 これが無いと「もっと見る」が押しても何も起きない。
  //    表示/非表示だけ切り替えていて、次の200件を描く所が繋がっていなかった
  //    （2026/10/8 庄司さん「もっと見る　押してもうごかない」）
  more.addEventListener('click',function(){draw(STEP);});
  fillAcc();
  run();
}

  box.querySelectorAll('.adsel').forEach(function(s){
    s.addEventListener('change',function(){
      s.parentNode.querySelector('.adnew').style.display=s.value==='__new'?'block':'none';});
  });
  box.querySelectorAll('.adreg').forEach(function(b){
    b.addEventListener('click',async function(){
      var tr=b.closest('tr'),acc=tr.getAttribute('data-acc'),
          s=tr.querySelector('.adsel'),
          per=s.value==='__new'?tr.querySelector('.adnew').value.trim():s.value;
      var k=ls('hedit');if(!k){show();say('先にパスワードを入れてください',true);return;}
      if(!per){say('オプチャ名を選んでください',true);return;}
      if(!confirm(acc+' を「'+per+'」に紐づけます'))return;
      b.disabled=true;say('登録中…');
      try{
        var t=await anon();
        var res=await fetch(ZK_DB+'/hachimitsu/'+k+'/requests.json?auth='+encodeURIComponent(t),
          {method:'POST',headers:{'Content-Type':'application/json'},
           body:JSON.stringify({account:acc,person:per,at:{'.sv':'timestamp'}})});
        if(!res.ok)throw new Error('書き込めませんでした（'+res.status+'）');
        tr.querySelector('td:last-child').textContent='受付済み';
        say(acc+' → '+per+' を受け付けました。次の毎時集計で反映されます');
      }catch(e){b.disabled=false;say(e.message,true);}
    });
  });
}


function b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},base,256);
  var key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  return JSON.parse(new TextDecoder().decode(plain));
}
function show(p){
  document.getElementById('gate').style.display='none';
  var w=document.getElementById('wrap');
  w.innerHTML=p.html; w.style.display='block';
  initLog(p.log); initAdmin();
}
async function tryPw(pw,quiet){
  try{ var p=await unlock(pw);
    try{localStorage.setItem('hpw',pw);}catch(e){}
    show(p); return true;
  }catch(e){
    if(!quiet)document.getElementById('err').textContent='パスワードが違います';
    try{localStorage.removeItem('hpw');}catch(e2){}
    return false;
  }
}
window.addEventListener('DOMContentLoaded',function(){
  var saved=null; try{saved=localStorage.getItem('hpw');}catch(e){}
  if(saved)tryPw(saved,true);
  var go=function(){var v=document.getElementById('pw').value;
    if(v)tryPw(v,false);};
  document.getElementById('go').addEventListener('click',go);
  document.getElementById('pw').addEventListener('keydown',function(e){
    if(e.key==='Enter')go();});
});
